name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may merge into main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs into main must come from dev (got '${{ github.head_ref }}')."
            exit 1
          fi

  backend:
    name: Backend (fmt, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
