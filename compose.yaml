name: elimin8

services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.9
    environment:
      RUSTFS_ACCESS_KEY: "${PHOTO_STORAGE_ACCESS_KEY:?Set PHOTO_STORAGE_ACCESS_KEY in .env}"
      RUSTFS_SECRET_KEY: "${PHOTO_STORAGE_SECRET_KEY:?Set PHOTO_STORAGE_SECRET_KEY in .env}"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ADDRESS: ":9000"
    command: ["/data"]
    ports:
      - "127.0.0.1:${PHOTO_STORAGE_PORT:-9000}:9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DATABASE: "elimin8"
      PHOTO_RETENTION_HOURS: "${PHOTO_RETENTION_HOURS:-24}"
      PHOTO_STORAGE_ENDPOINT: "http://rustfs:9000"
      PHOTO_STORAGE_PROVIDER: "rustfs"
      PHOTO_STORAGE_REGION: "${PHOTO_STORAGE_REGION:-us-east-1}"
      PHOTO_STORAGE_BUCKET: "${PHOTO_STORAGE_BUCKET:-elimin8-photos}"
      PHOTO_STORAGE_ACCESS_KEY: "${PHOTO_STORAGE_ACCESS_KEY:?Set PHOTO_STORAGE_ACCESS_KEY in .env}"
      PHOTO_STORAGE_SECRET_KEY: "${PHOTO_STORAGE_SECRET_KEY:?Set PHOTO_STORAGE_SECRET_KEY in .env}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongodb_data:
  rustfs_data:
